
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142d4e">
  <title>Cole Gon | Asistencia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #172b45;
    }

    header {
      background: #142d4e;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    main {
      max-width: 520px;
      margin: 28px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #iniciar {
      background: #142d4e;
      color: white;
    }

    #detener {
      background: #e8edf3;
      color: #142d4e;
    }

    #acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    #acciones[hidden] {
      display: none;
    }

    #acciones button {
      margin-top: 0;
      min-height: 58px;
    }

    #entrada {
      background: #176b45;
      color: white;
    }

    #salida {
      background: #a83232;
      color: white;
    }

    #estado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #eef3f8;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .nota {
      color: #52647a;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      main {
        margin: 16px 10px;
        padding: 18px;
      }

      #acciones {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Cole Gon</h1>
    <p>Registro de asistencia</p>
  </header>

  <main>
    <h2>Leer tarjeta NFC</h2>

    <p>
      Pulsa el botón y acerca la tarjeta a la parte trasera
      del móvil. Después, elige si el alumno entra o sale.
    </p>

    <button id="iniciar">Leer tarjeta NFC</button>
    <button id="detener" hidden>Detener lectura</button>

    <div id="acciones" hidden>
      <button id="entrada" type="button">ENTRADA</button>
      <button id="salida" type="button">SALIDA</button>
    </div>

    <div id="estado" role="status" aria-live="polite">
      Preparado para iniciar.
    </div>

    <p class="nota">
      Necesitas un móvil Android compatible con NFC,
      NFC activado y conexión a Internet.
    </p>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxCs1Hi1dsE9lm8bK71nzqQyq-f5-pGtDw7f-YGbaVdOLSMySYAYZ7x3bT66_Sfh19R/exec";

    const iniciar = document.getElementById("iniciar");
    const detener = document.getElementById("detener");
    const entrada = document.getElementById("entrada");
    const salida = document.getElementById("salida");
    const acciones = document.getElementById("acciones");
    const estado = document.getElementById("estado");

    let lector = null;
    let activo = false;
    let codigoPendiente = null;
    let enviando = false;
    let ultimoCodigo = "";
    let ultimaLectura = 0;

    function mostrar(mensaje) {
      estado.textContent = mensaje;
    }

    iniciar.addEventListener("click", async () => {
      if (!("NDEFReader" in window)) {
        mostrar(
          "Este navegador no admite lectura NFC web. " +
          "Prueba Chrome actualizado en Android y comprueba NFC."
        );
        return;
      }

      try {
        lector = new NDEFReader();
        await lector.scan();

        activo = true;
        iniciar.hidden = true;
        detener.hidden = false;

        mostrar("Lector activado. Acerca una tarjeta NFC.");

        lector.onreadingerror = () => {
          if (activo && !codigoPendiente && !enviando) {
            mostrar(
              "No se pudo leer la tarjeta. Inténtalo otra vez."
            );
          }
        };

        lector.onreading = (evento) => {
          if (!activo || codigoPendiente || enviando) {
            return;
          }

          const registro = Array.from(
            evento.message.records
          ).find(r => r.recordType === "text");

          if (!registro) {
            mostrar(
              "La tarjeta no contiene un registro de texto."
            );
            return;
          }

          const codigo = new TextDecoder(
            registro.encoding || "utf-8"
          ).decode(registro.data).trim().toUpperCase();

          if (!/^CG-[A-Z0-9]{6}$/.test(codigo)) {
            mostrar("El código de la tarjeta no es válido.");
            return;
          }

          const ahora = Date.now();

          if (
            codigo === ultimoCodigo &&
            ahora - ultimaLectura < 3000
          ) {
            return;
          }

          ultimoCodigo = codigo;
          ultimaLectura = ahora;
          codigoPendiente = codigo;

          acciones.hidden = false;

          mostrar(
            "Tarjeta " + codigo +
            " leída. Selecciona ENTRADA o SALIDA."
          );
        };

      } catch (error) {
        mostrar(
          "No se pudo iniciar la lectura NFC. Comprueba que NFC " +
          "esté activado y permite el acceso si el navegador lo solicita."
        );
      }
    });

    async function registrarAsistencia(tipo) {
      if (!codigoPendiente || enviando) {
        return;
      }

      const codigo = codigoPendiente;
      enviando = true;

      entrada.disabled = true;
      salida.disabled = true;

      mostrar(
        "Enviando " + tipo.toLowerCase() +
        " de la tarjeta " + codigo + "..."
      );

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify({
            codigo: codigo,
            tipo: tipo
          })
        });

        mostrar(
          "Solicitud de " + tipo.toLowerCase() +
          " enviada para " + codigo +
          ". Comprueba la pestaña Asistencia para confirmar el registro."
        );

      } catch (error) {
        mostrar(
          "No se pudo enviar la solicitud. Comprueba la conexión " +
          "a Internet y la URL de Apps Script."
        );

      } finally {
        codigoPendiente = null;
        enviando = false;

        entrada.disabled = false;
        salida.disabled = false;

        acciones.hidden = true;

        if (activo) {
          iniciar.hidden = true;
          detener.hidden = false;
        }
      }
    }

    entrada.addEventListener("click", () => {
      registrarAsistencia("Entrada");
    });

    salida.addEventListener("click", () => {
      registrarAsistencia("Salida");
    });

    detener.addEventListener("click", () => {
      activo = false;
      codigoPendiente = null;
      acciones.hidden = true;

      lector = null;

      iniciar.hidden = false;
      detener.hidden = true;

      entrada.disabled = false;
      salida.disabled = false;

      mostrar("Lectura detenida.");
    });
  </script>
</body>
</html>
